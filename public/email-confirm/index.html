<!DOCTYPE html>
<!--
  Jazari One — Post-confirmation redirect / "finish creating your account" page.
  Shown AFTER the user taps "Confirm email" in the verification email.

  Two device scenarios, chosen by JS on load:
    - MOBILE: auto-redirect into the app via the Branch deep link. A safe
      fallback ("You'll be redirected soon" + "Open Jazari One" button) is shown
      in case the auto-redirect is blocked or the app is not installed.
    - DESKTOP: show a QR code so the user can continue the account-creation flow
      on their phone (the app is mobile-only).

  Design principles carried over from the email template:
    - Centered single-column, 600px card, 16px radius.
    - Light palette #f4f5f3 page / #ffffff card, brand green accent (#1AD959 -> #4EFF9E).
    - Dark-mode safe via prefers-color-scheme + light/dark logo swap.
    - Legal block removed; only the copyright line is kept.

  Config:
    - BRANCH_LINK below is the single source of truth for the deep link and is
      also what the QR code (qr.svg) encodes. Keep them in sync.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <meta name="robots" content="noindex,nofollow">
  <title>Finish creating your Jazari One account</title>

  <style>
    :root {
      --bg-page:  #f4f5f3;
      --bg-card:  #ffffff;
      --text-main:#0b1410;
      --text-soft:#5b635e;
      --text-mute:#9aa19c;
      --brand-1:  #1AD959;
      --brand-2:  #4EFF9E;
      --btn-text: #06210f;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page:  #0b0f0d;
        --bg-card:  #15191a;
        --text-main:#f3f5f3;
        --text-soft:#a8b0ac;
        --text-mute:#7a827d;
      }
    }

    * { box-sizing:border-box; -webkit-text-size-adjust:100%; }
    html, body { margin:0; padding:0; }

    body {
      background:var(--bg-page);
      color:var(--text-main);
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px 16px;
    }

    .card {
      width:100%;
      max-width:600px;
      background:var(--bg-card);
      border-radius:16px;
      padding:56px 48px 40px 48px;
      text-align:center;
    }

    /* Logo swap */
    .logo { width:204px; max-width:66%; height:auto; }
    .logo-dark { display:none; }
    @media (prefers-color-scheme: dark) {
      .logo-light { display:none; }
      .logo-dark  { display:inline-block; }
    }

    .h1 {
      margin:56px 0 14px 0;
      font-size:23px;
      line-height:1.3;
      font-weight:700;
      color:var(--text-main);
    }

    .lede {
      margin:0 auto;
      max-width:420px;
      font-size:16px;
      line-height:1.6;
      color:var(--text-soft);
    }

    /* Brand pill button (matches the email + the app's Continue button) */
    .btn {
      display:inline-block;
      margin-top:32px;
      padding:0 34px;
      min-width:240px;
      height:54px;
      line-height:54px;
      border-radius:50px;
      font-size:16px;
      font-weight:600;
      color:var(--btn-text);
      text-decoration:none;
      background-color:var(--brand-1);
      background-image:linear-gradient(135deg, var(--brand-1) 0%, var(--brand-2) 100%);
      box-shadow:0 8px 22px rgba(26,217,89,0.35);
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .btn:hover { transform:translateY(-1px); box-shadow:0 10px 26px rgba(26,217,89,0.42); }
    .btn:active { transform:translateY(0); }

    /* QR — always on a white tile so it stays scannable in dark mode */
    .qr-tile {
      display:inline-block;
      margin-top:36px;
      padding:20px;
      background:#ffffff;
      border-radius:20px;
      box-shadow:0 10px 30px rgba(11,20,16,0.10);
    }
    .qr-tile img { display:block; width:220px; height:220px; }

    .hint {
      margin:18px auto 0 auto;
      max-width:360px;
      font-size:13px;
      line-height:1.6;
      color:var(--text-mute);
    }

    /* Redirect spinner (mobile) */
    .spinner {
      margin:36px auto 0 auto;
      width:34px;
      height:34px;
      border-radius:50%;
      border:3px solid rgba(26,217,89,0.22);
      border-top-color:var(--brand-1);
      animation:spin .8s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation:none; }
      .btn { transition:none; }
    }

    .copyright {
      margin:56px 0 0 0;
      font-size:11px;
      line-height:1.6;
      color:var(--text-mute);
    }

    .is-hidden { display:none !important; }

    @media only screen and (max-width:600px) {
      .card { padding:36px 22px 30px 22px; }
      .h1 { font-size:21px; }
      .btn { display:block; width:100%; }
    }
  </style>
</head>

<body>
  <main class="card">

    <!-- Logo (light = black wordmark, dark = white wordmark) -->
    <a href="https://jazari.xyz" style="text-decoration:none; display:inline-block;">
      <img class="logo logo-light" src="https://cdn.jazarimoney.com/static/logos/jazari-one-logo-black.png" width="204" alt="Jazari One">
      <img class="logo logo-dark"  src="https://cdn.jazarimoney.com/static/logos/jazari-one-logo-white.png"  width="204" alt="Jazari One">
    </a>

    <!-- ============ MOBILE: auto-redirect into the app ============ -->
    <section id="state-mobile" class="is-hidden">
      <h1 class="h1">Email confirmed</h1>
      <p class="lede">You&rsquo;ll be redirected to Jazari One to finish creating your account. If nothing happens, tap the button below.</p>
      <div class="spinner" role="status" aria-label="Redirecting to Jazari One"></div>
      <a class="btn" id="open-app" href="#">Open Jazari One</a>
    </section>

    <!-- ============ DESKTOP: continue on phone via QR ============ -->
    <section id="state-desktop" class="is-hidden">
      <h1 class="h1">Email confirmed</h1>
      <p class="lede">Scan this code with your phone to complete creating your account in Jazari One.</p>
      <div class="qr-tile">
        <img src="qr.svg" alt="QR code to open Jazari One on your phone" width="220" height="220">
      </div>
    </section>

    <p class="copyright">&copy; 2026 Jazari One. All rights reserved.</p>
  </main>

  <script>
    (function () {
      // Single source of truth for the deep link. Must match what qr.svg encodes.
      var BRANCH_LINK = "https://jazarione.app.link/WkuNVbyKr4b";

      var mobile  = document.getElementById("state-mobile");
      var desktop = document.getElementById("state-desktop");
      var openApp = document.getElementById("open-app");

      openApp.setAttribute("href", BRANCH_LINK);

      // Treat phones/tablets as "mobile". Branch handles the app-vs-store routing.
      var ua = navigator.userAgent || "";
      var isMobile = /Android|iPhone|iPad|iPod|Windows Phone|webOS|BlackBerry|Mobile/i.test(ua)
        || (('ontouchstart' in window) && window.matchMedia('(max-width: 820px)').matches);

      if (isMobile) {
        mobile.classList.remove("is-hidden");
        // Give the page a beat to paint the fallback, then hand off to the app.
        window.setTimeout(function () {
          window.location.href = BRANCH_LINK;
        }, 800);
      } else {
        desktop.classList.remove("is-hidden");
      }
    })();
  </script>

  <noscript>
    <!-- JS-off fallback: show the QR path, which needs no scripting. -->
    <style>#state-desktop{display:block !important;}</style>
  </noscript>
</body>
</html>
